name: Fabric Technologies
description: 'Fabric Technologies operates Fabric by Gerber Life, a direct-to-consumer
  financial services platform built for parents and families. The company offers term
  life insurance with an instant online quote and application flow, UGMA custodial
  investment accounts and 529 college-savings plans for children, and digital estate-planning
  tools including free wills. Fabric is backed by Gerber Life, part of Western & Southern
  Financial Group, and was originally venture-funded by Bessemer Venture Partners.
  The platform emphasizes fast, accessible, mobile-first family financial planning
  spanning protection, wealth-building, and legacy planning. Fabric is a consumer-facing
  service and does not currently publish a public developer API or portal.'
